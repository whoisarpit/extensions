name: publish__gemini-always-temp

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish__gemini-always-temp.yml"
      - "gemini-always-temp/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/publish__gemini-always-temp.yml"
      - "gemini-always-temp/**"

permissions:
  contents: write

jobs:
  package-gemini-always-temp:
    runs-on: ubuntu-latest
    environment: gemini-always-temp
    env:
      EXTENSION_DIR: gemini-always-temp
      EXTENSION_NAME: Gemini Always Temporary Chat
      EXTENSION_SLUG: gemini-always-temp
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read version from manifest
        id: version
        run: |
          version=$(jq -r .version "$EXTENSION_DIR/chrome/manifest.json")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$EXTENSION_SLUG-v$version" >> "$GITHUB_OUTPUT"

      - name: Package Chrome extension
        run: cd "$EXTENSION_DIR/chrome" && zip -r "../../$EXTENSION_SLUG-chrome.zip" .

      - name: Upload Chrome extension artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.EXTENSION_SLUG }}-chrome
          path: ${{ env.EXTENSION_SLUG }}-chrome.zip

      - name: Check if release exists
        if: github.event_name == 'push'
        id: check_release
        run: |
          if gh release view "${{ steps.version.outputs.release_tag }}" &>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release
        if: github.event_name == 'push' && steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.release_tag }}
          name: ${{ env.EXTENSION_NAME }} v${{ steps.version.outputs.version }}
          files: ${{ env.EXTENSION_SLUG }}-chrome.zip

      - name: Resolve Chrome Web Store publish config
        if: github.event_name == 'push' && steps.check_release.outputs.exists == 'false'
        id: cws_config
        run: |
          if [ -n "${{ secrets.CWS_PUBLISHER_ID }}" ] && [ -n "${{ secrets.CWS_EXTENSION_ID }}" ] && [ -n "${{ secrets.CWS_CLIENT_ID }}" ] && [ -n "${{ secrets.CWS_CLIENT_SECRET }}" ] && [ -n "${{ secrets.CWS_REFRESH_TOKEN }}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Chrome Web Store publish skipped: set CWS_PUBLISHER_ID, CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN."
          fi

      - name: Get Chrome Web Store access token
        if: github.event_name == 'push' && steps.check_release.outputs.exists == 'false' && steps.cws_config.outputs.enabled == 'true'
        id: cws_token
        run: |
          TOKEN_RESPONSE=$(curl -sS -X POST https://oauth2.googleapis.com/token \
            -d "client_id=${{ secrets.CWS_CLIENT_ID }}" \
            -d "client_secret=${{ secrets.CWS_CLIENT_SECRET }}" \
            -d "refresh_token=${{ secrets.CWS_REFRESH_TOKEN }}" \
            -d "grant_type=refresh_token")
          ACCESS_TOKEN=$(echo "$TOKEN_RESPONSE" | jq -r '.access_token // empty')
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "Failed to get Chrome Web Store access token"
            echo "$TOKEN_RESPONSE"
            exit 1
          fi
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"

      - name: Upload Chrome extension to Chrome Web Store
        if: github.event_name == 'push' && steps.check_release.outputs.exists == 'false' && steps.cws_config.outputs.enabled == 'true'
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ steps.cws_token.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@$EXTENSION_SLUG-chrome.zip" \
            "https://chromewebstore.googleapis.com/upload/v2/publishers/${{ secrets.CWS_PUBLISHER_ID }}/items/${{ secrets.CWS_EXTENSION_ID }}:upload"

      - name: Publish Chrome extension to Chrome Web Store
        if: github.event_name == 'push' && steps.check_release.outputs.exists == 'false' && steps.cws_config.outputs.enabled == 'true'
        run: |
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer ${{ steps.cws_token.outputs.access_token }}" \
            -H "x-goog-api-version: 2" \
            "https://chromewebstore.googleapis.com/v2/publishers/${{ secrets.CWS_PUBLISHER_ID }}/items/${{ secrets.CWS_EXTENSION_ID }}:publish"

      - name: Submit Firefox extension to AMO (listed)
        if: github.event_name == 'push' && steps.check_release.outputs.exists == 'false'
        run: |
          npx web-ext sign \
            --source-dir="$EXTENSION_DIR/firefox/" \
            --channel=listed \
            --api-key="${{ secrets.AMO_JWT_ISSUER }}" \
            --api-secret="${{ secrets.AMO_JWT_SECRET }}" \
            --approval-timeout=0
